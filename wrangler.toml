# ============================================================================
# 拾光工作室官网 · Cloudflare Workers + Static Assets
#
# 部署流程：
#   1) npm run build          # Vite 产出 dist/
#   2) npx wrangler deploy    # 上传 Worker + dist/ 静态资源
#
# 本地开发：
#   npm run dev:api           # wrangler dev（Worker + 静态资源，端口 8787）
#   npm run dev               # vite dev（端口 5175，/api 反向代理到 8787）
# ============================================================================

# ⚠️ Worker 名必须与 Cloudflare 面板里的项目名一致，否则用 Git 构建部署时会看到
#    `Failed to match Worker name... Overriding using the CI provided Worker name`（CI 会覆盖，
#    并自动开一个 PR 想帮你改这里）。面板项目名默认取自仓库名，故与仓库同名。
name = "kingcola-icg-home"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# 只走下面的自定义域名：`*.workers.dev` 在国内访问不了（DNS 被污染），留着也没用，
# 而且这一行能让部署日志不再提示「workers_dev 未设置」。
workers_dev = false

# ---------------------------------------------------------------------------
# 静态资源：dist/ 由 Vite 构建
# run_worker_first 只把 /api/* 交给 Worker，其余静态资源由边缘直接返回，
# 完全不消耗 Worker 请求配额 —— 这是 Workers + Static Assets 的核心优势。
# ---------------------------------------------------------------------------
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ---------------------------------------------------------------------------
# 自定义域名：`*.workers.dev` 在国内会被 DNS 污染（解析到 31.13.94.23 这类 Facebook 的 IP）
# 而完全访问不了，所以线上入口必须用自有域名。要求域名（或其父 zone，如 002038.xyz）
# 托管在同一个 Cloudflare 账号下；不需要自定义域就把这一段删掉（退回 workers.dev）。
# ---------------------------------------------------------------------------
[[routes]]
pattern = "kingcola.002038.xyz"
custom_domain = true

# ---------------------------------------------------------------------------
# D1：唯一事实源（内容、管理员、审计、站点配置）
# **首次部署自动创建**：这里故意不写 database_id —— wrangler 会按 database_name 找，
# 找不到就建一个（建好后 ID 由它接管，不会回写到本文件）。
# 想复用自己已有的库：把它的 database_id 填进来即可（填了就不再自动创建）。
# ⚠️ 千万别写一个假的占位符 —— 它会被原样发给 API 而让整个部署失败
#    （上一版就是 `database_id = "REPLACE_WITH_..."` 导致的 `KV namespace ... is not valid` 同类错误）。
# 建表要等首次部署之后：`npm run db:migrate:remote`（按**库名**执行，不需要 ID）
# ---------------------------------------------------------------------------
[[d1_databases]]
# 绑定别名 DB → 库名 kingcola-db
binding = "DB"
database_name = "kingcola-db"
# database_id = "想复用已有的库就填这里（不填 = 首次部署自动创建）"

# ---------------------------------------------------------------------------
# KV：运行时配置缓存 / 会话白名单（可选，缺失时自动降级为直读 D1）
# **首次部署自动创建**：不写 id 就是让 wrangler 建一个（KV 没有名字字段，名字由它定）。
# 想复用自己已有的命名空间：把 id 填进来。
# ---------------------------------------------------------------------------
[[kv_namespaces]]
# 绑定别名 CONFIG_KV（代码里就是 env.CONFIG_KV）
binding = "CONFIG_KV"
# id = "想复用已有的命名空间就填这里（不填 = 首次部署自动创建）"

# ---------------------------------------------------------------------------
# R2：文件存储（**按桶名绑定，没有 ID 要填**；桶建好、名字对上即可）。
# 默认绑定别名 FILES（预设桶名 kingcola-files，见 README「部署」；站点图片与报名表两个业务目标都指向它，
#       可在后台「对象存储」页改为任意 S3 兼容存储，或追加新绑定后按名选择）：
#   npx wrangler r2 bucket create kingcola-files
#
# ⚠️ R2 是「需要先在面板开通的服务」（免费额度也要开通一次），**没开通的账号直接部署会失败**
#    （provision 那一步报错，日志里是 `Provisioning FILES (R2 Bucket)`）。
#    所以部署统一走 `node scripts/ci-deploy.mjs`：它先探测 R2 能不能用 ——
#    能用就按本文件原样部署（零配置拿到 FILES 绑定）；不能用就临时把下面这段剔掉再部署，
#    应用自动降级（上传/报名表接口 503、后台「对象存储」页可改接任意 S3 兼容存储、关闭本届会拒绝）。
# ⚠️ 这段**不要手动删** —— `wrangler dev` 靠它模拟本地 R2 桶，本地开发与
#    scripts/smoke-api.ps1 的头像上传（8a/8b）都依赖这个绑定。
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "FILES"
bucket_name = "kingcola-files"

# 需要给站点图片 / 报名表配独立桶时，取消注释并到后台「对象存储」页把对应目标的
# 绑定名改为下面的名字即可（改完需重新部署）：
# [[r2_buckets]]
# binding = "FILES_APPLICATIONS"
# bucket_name = "kingcola-applications"

# ---------------------------------------------------------------------------
# 环境变量（敏感值一律用 `npx wrangler secret put <NAME>` 写入，不要写这里）
# ---------------------------------------------------------------------------
[vars]
# 允许跨域访问 API 的来源，逗号分隔。生产环境与前端同源时保持为空即可。
ALLOWED_ORIGINS = ""
# 授权服务器基址（国内 EdgeOne 上的教务网登录服务）。
# 现在由后台「系统设置 → 流量通道」维护，这里只是可选的部署引导值：
# 后台保存过一次后，D1 里的值会覆盖它。留空即「未接通」。
SSO_AUTHORIZE_BASE = ""
# 主站在授权服务器处的注册标识，需落在其客户端白名单内
SSO_CLIENT_ID = "kingcola"

# ---------------------------------------------------------------------------
# 刻意没有 [triggers] crons：招新的每一次阶段开、关都由管理员在后台点按钮决定
# （见 shared/recruit.ts 的 RECRUIT_ACTION_META），没有「到点自动关闭」这种事。
# 缺考也在「结束笔试/面试/答辩」这个动作里一次性标完，不需要定时扫。
# ---------------------------------------------------------------------------

[observability]
enabled = true

[env.preview]
name = "kingcola-preview"

[env.preview.vars]
SSO_AUTHORIZE_BASE = ""
